name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify tag and notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version = JSON.parse(fs.readFileSync('package.json')).version;
          if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.RELEASE_TAG !== `v${version}`) throw Error('Tag/version mismatch');
          const notes = fs.readFileSync(`docs/releases/v${version}.md`, 'utf8');
          if (!notes.startsWith(`# Treco v${version}\n`)) throw Error('Missing release notes');
          NODE
      - run: npm ci
      - run: npm run package
      - run: npm run lint:firefox
      - run: git diff --exit-code -- Treco.user.js Zynubo.user.js icon.png
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:stability
      - run: npm run test:browser:upstream
      - uses: browser-actions/setup-firefox@v1
        id: firefox
      - run: npm run test:extensions:browser
        env:
          ZYNUBO_CHROMIUM: playwright
          ZYNUBO_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
      - name: Verify exact release files
        run: python3 build/verify-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          if-no-files-found: error
          path: |
            dist/Treco-*.zip
            dist/Treco.user.js
            dist/SHA256SUMS
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release-files
      - name: Verify downloaded checksums
        working-directory: release-files
        run: sha256sum --check SHA256SUMS
      - name: Publish and verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to modify an existing release.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --repo "$REPOSITORY" --verify-tag --latest \
            --title "Treco $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md" \
            release-files/Treco-*.zip release-files/Treco.user.js release-files/SHA256SUMS
          gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json url,tagName,assets
          mkdir downloaded
          gh release download "$RELEASE_TAG" --repo "$REPOSITORY" --dir downloaded
          cmp release-files/SHA256SUMS downloaded/SHA256SUMS
          (cd downloaded && sha256sum --check SHA256SUMS)
